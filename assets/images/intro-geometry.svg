<?xml version="1.0" encoding="utf-8"?>
<!-- Sacred Circle & Flower of Life: concentric circles, flower pattern, Vesica Piscis, and Metatron's cube inspired elements -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="sgTitle sgDesc">
  <title id="sgTitle">Sacred circle and flower of life background</title>
  <desc id="sgDesc">Intricate sacred geometry with concentric circles, flower of life pattern, and geometric harmonics.</desc>
  <defs>
    <style>
      .sacred-circle { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
      .sacred-line { stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.04; }
      .medium { opacity: 0.06; }
      .brighter { opacity: 0.10; }
    </style>
  </defs>

  <!-- Central point -->
  <circle cx="500" cy="500" r="2" fill="#ffffff" opacity="0.08" />

  <!-- Main concentric circles (foundation) -->
  <circle cx="500" cy="500" r="80" class="sacred-circle faint" stroke-width="1.2" />
  <circle cx="500" cy="500" r="160" class="sacred-circle faint" stroke-width="1.2" />
  <circle cx="500" cy="500" r="240" class="sacred-circle faint" stroke-width="1.2" />
  <circle cx="500" cy="500" r="320" class="sacred-circle faint" stroke-width="1.2" />
  <circle cx="500" cy="500" r="400" class="sacred-circle medium" stroke-width="1.4" />
  <circle cx="500" cy="500" r="480" class="sacred-circle brighter" stroke-width="2" />

  <!-- Flower of Life - First Ring (6 circles around center at distance 80) -->
  <circle cx="580" cy="500" r="80" class="sacred-circle faint" stroke-width="1.1" />
  <circle cx="540" cy="569.3" r="80" class="sacred-circle faint" stroke-width="1.1" />
  <circle cx="460" cy="569.3" r="80" class="sacred-circle faint" stroke-width="1.1" />
  <circle cx="420" cy="500" r="80" class="sacred-circle faint" stroke-width="1.1" />
  <circle cx="460" cy="430.7" r="80" class="sacred-circle faint" stroke-width="1.1" />
  <circle cx="540" cy="430.7" r="80" class="sacred-circle faint" stroke-width="1.1" />

  <!-- Flower of Life - Second Ring (6 circles, second petal ring) -->
  <circle cx="660" cy="380" r="80" class="sacred-circle faint" stroke-width="1.0" />
  <circle cx="660" cy="620" r="80" class="sacred-circle faint" stroke-width="1.0" />
  <circle cx="500" cy="660" r="80" class="sacred-circle faint" stroke-width="1.0" />
  <circle cx="500" cy="340" r="80" class="sacred-circle faint" stroke-width="1.0" />
  <circle cx="340" cy="620" r="80" class="sacred-circle faint" stroke-width="1.0" />
  <circle cx="340" cy="380" r="80" class="sacred-circle faint" stroke-width="1.0" />

  <!-- Vesica Piscis (overlapping circles of creation) -->
  <circle cx="380" cy="500" r="120" class="sacred-circle faint" stroke-width="1.3" />
  <circle cx="620" cy="500" r="120" class="sacred-circle faint" stroke-width="1.3" />

  <!-- Radial lines (12-fold symmetry, Metatron's Cube inspired) -->
  <g class="sacred-line medium" stroke-width="0.8">
    <line x1="500" y1="500" x2="500" y2="40" />
    <line x1="500" y1="500" x2="933.0" y2="250" />
    <line x1="500" y1="500" x2="933.0" y2="750" />
    <line x1="500" y1="500" x2="500" y2="960" />
    <line x1="500" y1="500" x2="67.0" y2="750" />
    <line x1="500" y1="500" x2="67.0" y2="250" />
    <line x1="500" y1="500" x2="750" y2="933.0" />
    <line x1="500" y1="500" x2="250" y2="933.0" />
    <line x1="500" y1="500" x2="250" y2="67.0" />
    <line x1="500" y1="500" x2="750" y2="67.0" />
    <line x1="500" y1="500" x2="250" y2="500" />
    <line x1="500" y1="500" x2="750" y2="500" />
  </g>

  <!-- Inner hexagon (sacred geometry harmony) -->
  <g class="sacred-line medium" stroke-width="1.1" transform="translate(500,500)">
    <polygon points="0,-300 260,-150 260,150 0,300 -260,150 -260,-150" />
  </g>

  <!-- Smaller inner hexagon -->
  <g class="sacred-line faint" stroke-width="0.9" opacity="0.05" transform="translate(500,500)">
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" />
  </g>

  <!-- Sacred spiral suggestion (subtle additional circles) -->
  <circle cx="500" cy="500" r="120" class="sacred-circle faint" stroke-width="0.9" />
  <circle cx="500" cy="500" r="200" class="sacred-circle faint" stroke-width="0.9" />
  <circle cx="500" cy="500" r="280" class="sacred-circle faint" stroke-width="0.9" />
  <circle cx="500" cy="500" r="360" class="sacred-circle faint" stroke-width="0.9" />

</svg>