<?xml version="1.0" encoding="utf-8"?>
<!-- Sacred geometry SVG: subtle concentric circles, radial lines and a hexagon/flower motif. Designed to be used as a decorative background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="sgTitle sgDesc">
  <title id="sgTitle">Sacred geometry decorative background</title>
  <desc id="sgDesc">Subtle concentric circles and radial lines in soft tone for a background accent behind the intro section.</desc>
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
  </defs>

  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity="0.08" filter="url(#soften)">
    <!-- concentric circles -->
    <circle cx="500" cy="500" r="400" stroke-width="2" />
    <circle cx="500" cy="500" r="320" stroke-width="1.8" />
    <circle cx="500" cy="500" r="240" stroke-width="1.6" />
    <circle cx="500" cy="500" r="160" stroke-width="1.4" />
    <circle cx="500" cy="500" r="80" stroke-width="1.2" />

    <!-- radial lines (12) -->
    <g transform="translate(500,500)">
      <line x1="0" y1="-420" x2="0" y2="420" />
      <g transform="rotate(30)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(60)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(90)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(120)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(150)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(180)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(210)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(240)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(270)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(300)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
      <g transform="rotate(330)"><line x1="0" y1="-420" x2="0" y2="420" /></g>
    </g>

    <!-- hexagon and star -->
    <g transform="translate(500,500)">
      <polygon points="0,-300 260,-150 260,150 0,300 -260,150 -260,-150" stroke-width="1.6" />
      <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100" stroke-width="1.2" opacity="0.95" />
    </g>
  </g>

  <!-- Flower-of-life style small circles -->
  <g fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.06" transform="translate(500,500)">
    <circle cx="0" cy="0" r="52" />
    <circle cx="0" cy="-104" r="52" />
    <circle cx="90" cy="-52" r="52" />
    <circle cx="90" cy="52" r="52" />
    <circle cx="0" cy="104" r="52" />
    <circle cx="-90" cy="52" r="52" />
    <circle cx="-90" cy="-52" r="52" />
  </g>

  <!-- faint central glow -->
  <rect x="0" y="0" width="1000" height="1000" fill="url(#g1)" opacity="0.02" />
</svg>
