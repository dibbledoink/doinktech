<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000px" height="500px" viewBox="0 0 1000 500" zoomAndPan="disable" preserveAspectRatio="none">

    <defs>
        <linearGradient id="lineGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(94,66,166,0.4);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(183,78,145,0.2);stop-opacity:1" />
        </linearGradient>
        <linearGradient id="lineGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(183,78,145,0.4);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(94,66,166,0.2);stop-opacity:1" />
        </linearGradient>
    </defs>

    <style type="text/css"><![CDATA[
		line {
			stroke-linecap: round;
			stroke-linejoin: round;
		}
		.line-set-1 { stroke: url(#lineGradient1); stroke-width: 2px; }
		.line-set-2 { stroke: url(#lineGradient2); stroke-width: 1.5px; }
		.line-set-3 { stroke: rgba(255,255,255,0.08); stroke-width: 1px; }
		
		@keyframes flowLine {
			0% { stroke-dashoffset: 1000; }
			100% { stroke-dashoffset: 0; }
		}
		
		.animate-1 { 
			stroke-dasharray: 1000;
			animation: flowLine 20s linear infinite;
		}
		.animate-2 { 
			stroke-dasharray: 1000;
			animation: flowLine 25s linear infinite reverse;
		}
		.animate-3 { 
			stroke-dasharray: 1000;
			animation: flowLine 30s linear infinite;
		}
    ]]></style>

	<!-- Primary diagonal lines (main structure) -->
	<line x1="1100" y1="500" x2="-1000" y2="250" class="line-set-1"/>
	<line x1="1100" y1="500" x2="-1000" y2="-100" class="line-set-1"/>
	<line x1="1100" y1="500" x2="-1000" y2="-500" class="line-set-1"/>
	
	<!-- Secondary diagonal lines (depth) -->
	<line x1="1100" y1="500" x2="-250" y2="-500" class="line-set-1"/>
	<line x1="1100" y1="500" x2="300" y2="-500" class="line-set-1"/>
	<line x1="1100" y1="500" x2="750" y2="-500" class="line-set-1"/>

	<!-- Tertiary lines (right side sweep) -->
	<line x1="1750" y1="0" x2="750" y2="500" class="line-set-2"/>
	<line x1="1500" y1="0" x2="500" y2="500" class="line-set-2"/>
	<line x1="1150" y1="0" x2="150" y2="500" class="line-set-2"/>
	<line x1="700" y1="0" x2="-300" y2="500" class="line-set-2"/>
	<line x1="150" y1="0" x2="-850" y2="500" class="line-set-2"/>

	<!-- Additional geometric accents - vertical and horizontal lines for structure -->
	<line x1="500" y1="0" x2="500" y2="500" class="line-set-3"/>
	<line x1="250" y1="0" x2="250" y2="500" class="line-set-3"/>
	<line x1="750" y1="0" x2="750" y2="500" class="line-set-3"/>
	
	<!-- Horizontal accent lines -->
	<line x1="0" y1="250" x2="1000" y2="250" class="line-set-3"/>
	<line x1="0" y1="125" x2="1000" y2="125" class="line-set-3"/>
	<line x1="0" y1="375" x2="1000" y2="375" class="line-set-3"/>

	<!-- Additional crossing diagonals for extra visual interest -->
	<line x1="0" y1="0" x2="1000" y2="500" class="line-set-3"/>
	<line x1="1000" y1="0" x2="0" y2="500" class="line-set-3"/>
	<line x1="300" y1="0" x2="700" y2="500" class="line-set-3"/>
	<line x1="700" y1="0" x2="300" y2="500" class="line-set-3"/>

</svg>